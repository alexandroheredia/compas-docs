[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Native folder picker so the Library never depends on hand-typed paths.
tauri-plugin-dialog = "2"
# Native folder picker bridges a synchronous callback to async tauri commands via oneshot.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
compas-docs-core = { path = "../crates/compas-docs-core" }
